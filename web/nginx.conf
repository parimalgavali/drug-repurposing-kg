server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # /api/ask streams server-sent events; don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
