# /api/ask spends paid LLM credits: 10 questions/min per client IP (the API enforces its own limits too).
limit_req_zone $binary_remote_addr zone=ask:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    location = /api/ask {
        limit_req zone=ask burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @ask_limited;
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location @ask_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"too many questions, try again later"}';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        # /api/ask streams server-sent events; don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
