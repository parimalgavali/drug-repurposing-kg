[project]
name = "repurpose-kg"
version = "0.1.0"
description = "Drug-repurposing hypotheses from the PrimeKG biomedical knowledge graph"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
data = [
    "httpx>=0.27",
    "numpy>=2.0",
    "polars>=1.20",
    "pyarrow>=17",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
