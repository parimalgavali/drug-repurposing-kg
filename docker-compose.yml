services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-repurposekg-dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 4g
      NEO4J_server_memory_heap_max__size: 4g
      NEO4J_server_memory_pagecache_size: 4g
    volumes:
      - neo4j-data:/data
      - ./data/import:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-repurposekg-dev} 'RETURN 1'"]
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-repurposekg-dev}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ctgov-cache:/cache
    depends_on:
      neo4j:
        condition: service_healthy

  # One-shot: loads the bundled 498-node fixture + popularity predictions into an *empty* Neo4j.
  # `docker compose --profile demo up --build` runs it; it refuses to touch a non-fixture graph.
  seed:
    build: .
    profiles: ["demo"]
    command: ["python", "scripts/demo_fixture.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-repurposekg-dev}
    depends_on:
      neo4j:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  neo4j-data:
  ctgov-cache:
